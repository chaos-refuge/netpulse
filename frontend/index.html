<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetPulse — 网络检测与优化</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;
  --card-bg:#1a1d27;
  --card-border:#252832;
  --text:#e1e4ea;
  --text-dim:#8b8fa8;
  --green:#22c55e;
  --yellow:#eab308;
  --red:#ef4444;
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --accent:#06b6d4;
  --radius:12px;
  --transition:0.2s ease;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(6,182,212,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(139,92,246,0.04) 0%,transparent 50%);pointer-events:none;z-index:0}

.container{max-width:960px;margin:0 auto;padding:24px 20px;position:relative;z-index:1}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--card-border)}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-size:18px}
.logo svg{width:20px;height:20px;stroke:white;fill:none;stroke-width:2}
.title{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
.status-dot.online{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.5)}
.status-dot.offline{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.5)}
.status-text{font-size:13px;color:var(--text-dim)}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);font-size:13px;cursor:pointer;transition:var(--transition);white-space:nowrap}
.btn:hover{background:#252836;border-color:#35384a}
.btn:active{transform:scale(0.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.btn.primary:hover{background:#0891b2}
.btn.danger{background:transparent;border-color:rgba(239,68,68,0.3);color:var(--red)}
.btn.danger:hover{background:rgba(239,68,68,0.1)}

/* status cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px 20px;transition:var(--transition)}
.card:hover{border-color:#35384a}
.card-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.card-value{font-size:28px;font-weight:700;letter-spacing:-0.5px}
.card-sub{font-size:12px;color:var(--text-dim);margin-top:4px}
.card-value.green{color:var(--green)}
.card-value.yellow{color:var(--yellow)}
.card-value.red{color:var(--red)}
.wifi-bars{display:flex;gap:3px;align-items:flex-end;height:28px;margin-top:4px}
.wifi-bar{width:4px;background:var(--text-dim);border-radius:2px;transition:var(--transition)}
.wifi-bar.active{background:var(--green)}

/* panels */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
@media(max-width:700px){.panels{grid-template-columns:1fr}}
.panel{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:20px;overflow:hidden}
.panel-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel-title svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* detect buttons */
.quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.quick-actions .btn{font-size:12px;padding:6px 12px}
.output-area{background:#0b0d13;border-radius:8px;padding:14px;font-family:"SF Mono","Fira Code",monospace;font-size:12px;line-height:1.7;max-height:280px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:var(--text-dim)}
.output-area .ok{color:var(--green)}
.output-area .warn{color:var(--yellow)}
.output-area .err{color:var(--red)}
.output-area .info{color:var(--accent)}

/* dns preset buttons */
.dns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.dns-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:8px;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text);cursor:pointer;transition:var(--transition);text-align:left;font-size:12px}
.dns-btn:hover{border-color:var(--accent);background:#1e2130}
.dns-btn.active{border-color:var(--accent);background:rgba(6,182,212,0.1)}
.dns-btn .name{font-weight:600}
.dns-btn .ip{color:var(--text-dim);font-size:11px}
.dns-custom{display:flex;gap:8px;margin-bottom:12px}
.dns-custom input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid var(--card-border);background:#0b0d13;color:var(--text);font-size:13px;outline:none}
.dns-custom input:focus{border-color:var(--accent)}

/* optimize actions row */
.opt-actions{display:flex;gap:8px;flex-wrap:wrap}

/* log */
.log-area{background:#0b0d13;border-radius:8px;padding:12px 14px;max-height:160px;overflow-y:auto;font-size:12px;line-height:1.6;color:var(--text-dim);margin-top:12px}
.log-entry{display:flex;gap:8px;padding:2px 0}
.log-time{color:#555;white-space:nowrap}
.log-ok{color:var(--green)}
.log-err{color:var(--red)}

/* loading spinner */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid var(--card-border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;display:inline-block}
.loading{opacity:0.6;pointer-events:none}

/* diagnosis */
.diag-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius);margin-bottom:10px}
.diag-header.good{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2)}
.diag-header.warn{background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.2)}
.diag-header.bad{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2)}
.diag-score{font-size:32px;font-weight:700;letter-spacing:-1px}
.diag-verdict{font-size:15px;font-weight:600}
.diag-summary{font-size:12px;color:var(--text-dim);margin-top:2px}
.diag-finding{display:flex;gap:12px;padding:12px 14px;margin:6px 0;border-radius:8px;background:#0b0d13;border:1px solid var(--card-border);align-items:flex-start}
.diag-finding .sev{font-size:18px;flex-shrink:0;margin-top:2px}
.diag-finding .body{flex:1;min-width:0}
.diag-finding .title{font-size:13px;font-weight:600;margin-bottom:2px}
.diag-finding .desc{font-size:12px;color:var(--text-dim);margin-bottom:4px}
.diag-finding .sug{font-size:12px;color:var(--accent)}
.diag-finding .fix-btn{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:6px;border:1px solid var(--accent);background:rgba(6,182,212,0.1);color:var(--accent);font-size:11px;cursor:pointer;transition:var(--transition)}
.diag-finding .fix-btn:hover{background:rgba(6,182,212,0.2)}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8l2.8-2.8M17 7l2.8-2.8"/></svg>
      </div>
      <div>
        <div class="title">NetPulse</div>
        <div class="status-text"><span class="status-dot" id="globalDot"></span><span id="globalStatus">检测中...</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="refreshAll()">🔄 刷新</button>
    </div>
  </div>

  <!-- Status Cards -->
  <div class="cards" id="cards">
    <div class="card">
      <div class="card-label">📡 延迟</div>
      <div class="card-value" id="latVal">--</div>
      <div class="card-sub" id="latSub">丢包率 --</div>
    </div>
    <div class="card">
      <div class="card-label">🔍 DNS 速度</div>
      <div class="card-value" id="dnsVal">--</div>
      <div class="card-sub" id="dnsSub">服务器 --</div>
    </div>
    <div class="card">
      <div class="card-label">📶 WiFi 信号</div>
      <div class="card-value" id="wifiVal" style="font-size:22px">--</div>
      <div class="card-sub" id="wifiSub">SSID --</div>
    </div>
  </div>

  <!-- Panels -->
  <div class="panels">
    <!-- Left: Detection -->
    <div class="panel">
      <div class="panel-title">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        深度检测
      </div>
      <div class="quick-actions">
        <button class="btn" onclick="runPing('www.baidu.com',5)">🏓 Ping 百度</button>
        <button class="btn" onclick="runPing('www.google.com',5)">🏓 Ping Google</button>
        <button class="btn" onclick="runDnsSpeed()">🌐 DNS 测速</button>
        <button class="btn" onclick="runTrace('www.baidu.com')">🗺️ 路由追踪</button>
        <button class="btn primary" onclick="runDiagnose()">🩺 一键诊断</button>
      </div>
      <div class="output-area" id="detectOutput">点击上方按钮开始检测...</div>
      <!-- Diagnosis Results -->
      <div id="diagnoseResults" style="display:none;margin-top:14px"></div>
    </div>

    <!-- Right: Optimization -->
    <div class="panel">
      <div class="panel-title">
        <svg viewBox="0 0 24 24"><path d="M13 12h7M13 8h4M13 16h5M6 7v10M2 12h8"/></svg>
        一键优化
      </div>
      <div class="dns-grid" id="dnsGrid">
        <!-- filled by JS -->
      </div>
      <div class="dns-custom">
        <input type="text" id="customDns" placeholder="自定义 DNS，如 8.8.8.8, 8.8.4.4">
        <button class="btn primary" onclick="setCustomDns()">应用</button>
      </div>
      <div class="opt-actions">
        <button class="btn danger" onclick="flushDns()">🚀 刷新 DNS 缓存</button>
        <button class="btn" id="proxyBtn" onclick="toggleProxyBtn()" style="min-width:110px;justify-content:center">📡 代理状态</button>
      </div>
      <div class="log-area" id="logArea">
        <div class="log-entry"><span class="log-time">--:--</span><span>等待操作...</span></div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
const DNS_PRESETS = [
  {name:'114DNS', servers:'114.114.114.114, 114.114.115.115'},
  {name:'阿里 DNS', servers:'223.5.5.5, 223.6.6.6'},
  {name:'DNSPod', servers:'119.29.29.29, 119.28.28.28'},
  {name:'Cloudflare', servers:'1.1.1.1, 1.0.0.1'},
  {name:'Google', servers:'8.8.8.8, 8.8.4.4'},
];

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  renderDnsGrid();
  refreshAll();
});

function renderDnsGrid() {
  const grid = document.getElementById('dnsGrid');
  grid.innerHTML = DNS_PRESETS.map(p =>
    `<button class="dns-btn" onclick="setDns('${p.servers}')">
      <span class="name">${p.name}</span>
      <span class="ip">${p.servers}</span>
    </button>`
  ).join('');
}

// ===== API =====
async function api(url, body) {
  const opts = {method: body ? 'POST':'GET', headers:{}};
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(url, opts);
  return r.json();
}

// ===== REFRESH ALL =====
async function refreshAll() {
  try {
    const s = await api('/api/status');
    if (!s.ok) { setOffline(); return; }
    const d = s.data;

    // latency
    const latEl = document.getElementById('latVal');
    latEl.textContent = d.latency_ms > 0 ? d.latency_ms.toFixed(1)+' ms' : '--';
    latEl.className = 'card-value ' + (d.latency_ms < 30 ? 'green' : d.latency_ms < 100 ? 'yellow' : 'red');
    document.getElementById('latSub').textContent = '丢包率 '+(d.packet_loss_pct||0).toFixed(1)+'%';

    // dns
    const dnsEl = document.getElementById('dnsVal');
    dnsEl.textContent = d.dns_speed_ms > 0 ? d.dns_speed_ms.toFixed(1)+' ms' : '--';
    dnsEl.className = 'card-value ' + (d.dns_speed_ms < 20 ? 'green' : d.dns_speed_ms < 80 ? 'yellow' : 'red');
    document.getElementById('dnsSub').textContent = '服务器 '+(d.dns_servers||'--');

    // wifi
    const wEl = document.getElementById('wifiVal');
    const rssi = d.wifi_rssi || 0;
    wEl.textContent = d.wifi_ssid ? d.wifi_ssid : 'N/A';
    wEl.className = 'card-value ' + (rssi > -60 ? 'green' : rssi > -75 ? 'yellow' : 'red');
    document.getElementById('wifiSub').textContent = rssi ? rssi+' dBm' : d.network_name||'';

    setOnline();
  } catch(e) {
    setOffline();
  }
}

function setOnline() {
  document.getElementById('globalDot').className = 'status-dot online';
  document.getElementById('globalStatus').textContent = '在线';
}
function setOffline() {
  document.getElementById('globalDot').className = 'status-dot offline';
  document.getElementById('globalStatus').textContent = '离线';
}

// ===== PING =====
async function runPing(target, count) {
  const out = document.getElementById('detectOutput');
  out.innerHTML = '<span class="spinner"></span> 正在 Ping '+target+' ...';
  try {
    const r = await api('/api/detect/ping', {target, count});
    if (r.ok) {
      const d = r.data;
      out.innerHTML = `<span class="ok">✅ Ping ${d.target}</span>
发送: ${d.sent}  接收: ${d.received}  丢包: ${d.packet_loss_pct.toFixed(1)}%
平均延迟: <span class="${d.avg_rtt_ms<30?'ok':d.avg_rtt_ms<100?'warn':'err'}">${d.avg_rtt_ms.toFixed(2)} ms</span>
耗时: ${r.elapsed_ms}ms`;
    } else {
      out.innerHTML = `<span class="err">❌ ${r.error}</span>`;
    }
  } catch(e) {
    out.innerHTML = `<span class="err">❌ ${e.message}</span>`;
  }
}

// ===== DNS SPEED =====
async function runDnsSpeed() {
  const out = document.getElementById('detectOutput');
  out.innerHTML = '<span class="spinner"></span> 正在测试 DNS 解析速度...';
  try {
    const r = await api('/api/detect/dns', {domains:['www.baidu.com','www.google.com','www.github.com','www.apple.com','www.bilibili.com']});
    if (r.ok) {
      const d = r.data;
      let html = '<span class="ok">🌐 DNS 解析测速</span>\n';
      html += '─'.repeat(40)+'\n';
      for (const item of d.results) {
        const cls = item.error ? 'err' : item.latency_ms < 20 ? 'ok' : item.latency_ms < 80 ? 'warn' : 'err';
        html += `${item.domain.padEnd(25)} <span class="${cls}">${item.error||(item.latency_ms.toFixed(1)+' ms')}</span>  ${item.ip||''}\n`;
      }
      html += '─'.repeat(40)+'\n';
      html += `平均: <span class="info">${d.avg_ms.toFixed(2)} ms</span>`;
      out.innerHTML = html;
    } else {
      out.innerHTML = `<span class="err">❌ ${r.error}</span>`;
    }
  } catch(e) {
    out.innerHTML = `<span class="err">❌ ${e.message}</span>`;
  }
}

// ===== TRACEROUTE =====
async function runTrace(target) {
  const out = document.getElementById('detectOutput');
  out.innerHTML = '<span class="spinner"></span> 正在追踪路由到 '+target+' ...（最多 15 跳，约 30 秒）';
  try {
    const r = await api('/api/detect/trace', {target});
    if (r.ok && r.data && r.data.hops && r.data.hops.length > 0) {
      const d = r.data;
      let html = `<span class="ok">🗺️ 路由追踪: ${d.target}</span>\n`;
      html += '─'.repeat(50)+'\n';
      for (const h of d.hops) {
        const ip = h.ip||'*';
        const rtt = h.rtt_ms ? h.rtt_ms.toFixed(1)+' ms' : '*';
        html += `${String(h.hop).padStart(2)}  ${ip.padEnd(18)}  ${rtt}\n`;
      }
      html += '─'.repeat(50)+'\n';
      html += `共 ${d.hops.length} 跳`;
      out.innerHTML = html;
    } else if (r.error) {
      out.innerHTML = `<span class="err">❌ ${r.error}</span>\n\n<span class="warn">提示：部分网络环境（VPN/防火墙）会阻止路由追踪，属于正常现象。</span>`;
    } else {
      out.innerHTML = `<span class="warn">⚠️ 未收到路由数据\n\n提示：追踪超时或当前网络环境不支持（VPN/防火墙限制），属于正常现象。</span>`;
    }
  } catch(e) {
    out.innerHTML = `<span class="err">❌ ${e.message}</span>`;
  }
}

// ===== DNS SET =====
async function setDns(serversStr) {
  const servers = serversStr.split(',').map(s=>s.trim());
  addLog(`📡 正在切换 DNS 到 ${servers[0]}...`);
  try {
    const r = await api('/api/optimize/dns', {servers});
    if (r.ok) {
      addLog(`✅ DNS 已切换`, 'ok');
      refreshAll();
    } else {
      addLog(`❌ ${r.error}`, 'err');
    }
  } catch(e) {
    addLog(`❌ ${e.message}`, 'err');
  }
}

async function setCustomDns() {
  const val = document.getElementById('customDns').value.trim();
  if (!val) return;
  await setDns(val);
}

// ===== FLUSH DNS =====
async function flushDns() {
  addLog('🚀 正在刷新 DNS 缓存...');
  try {
    const r = await api('/api/optimize/flush');
    if (r.ok) {
      addLog('✅ DNS 缓存已刷新', 'ok');
    } else {
      addLog(`❌ ${r.error}`, 'err');
    }
  } catch(e) {
    addLog(`❌ ${e.message}`, 'err');
  }
}

// ===== PROXY =====
let proxyEnabled = false;
async function toggleProxyBtn() {
  proxyEnabled = !proxyEnabled;
  const btn = document.getElementById('proxyBtn');
  btn.textContent = proxyEnabled ? '📡 关闭代理' : '📡 开启代理';
  addLog(`${proxyEnabled?'📡 正在开启':'📡 正在关闭'} HTTP 代理...`);
  try {
    const r = await api('/api/optimize/proxy', {enable:proxyEnabled, type:'http'});
    if (r.ok) {
      addLog(`${proxyEnabled?'✅ HTTP 代理已开启':'✅ HTTP 代理已关闭'}`, 'ok');
    } else {
      addLog(`❌ ${r.error}`, 'err');
      proxyEnabled = !proxyEnabled;
    }
  } catch(e) {
    addLog(`❌ ${e.message}`, 'err');
    proxyEnabled = !proxyEnabled;
  }
}

// ===== LOG =====
// ===== DIAGNOSE =====
async function runDiagnose() {
  const out = document.getElementById('detectOutput');
  const diag = document.getElementById('diagnoseResults');
  out.innerHTML = '<span class="spinner"></span> 正在全面诊断网络...（约 5 秒）';
  diag.style.display = 'none';

  try {
    const r = await api('/api/diagnose');
    if (!r.ok) { out.innerHTML = `<span class="err">❌ ${r.error}</span>`; return; }
    const d = r.data;

    // Update output area
    out.innerHTML = `<span class="ok">✅ 诊断完成</span> 评分: ${d.overall_score}/100  ${d.overall_verdict}\n${d.summary}`;

    // Build diagnosis cards
    const headerCls = d.overall_score>=90?'good':d.overall_score>=70?'warn':'bad';
    let html = `<div class="diag-header ${headerCls}">
      <div class="diag-score">${d.overall_score}</div>
      <div>
        <div class="diag-verdict">${d.overall_verdict}</div>
        <div class="diag-summary">${d.summary}</div>
      </div>
    </div>`;

    for (const f of d.findings) {
      const sevEmoji = f.severity==='bad'?'🔴':f.severity==='warn'?'🟡':f.severity==='info'?'ℹ️':'✅';
      html += `<div class="diag-finding">
        <div class="sev">${sevEmoji}</div>
        <div class="body">
          <div class="title">${f.title}</div>
          <div class="desc">${f.description}</div>
          ${f.suggestion?`<div class="sug">💡 ${f.suggestion}</div>`:''}
          ${f.action?`<button class="fix-btn" onclick="applyFix('${f.action}')">${f.actionLabel||'一键修复'}</button>`:''}
        </div>
      </div>`;
    }

    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--text-dim)">
      <span>🕐 ${d.checked_at}</span>
      <button class="btn" onclick="runDiagnose()" style="font-size:11px;padding:4px 10px">🔄 重新诊断</button>
    </div>`;

    diag.innerHTML = html;
    diag.style.display = 'block';
  } catch(e) {
    out.innerHTML = `<span class="err">❌ ${e.message}</span>`;
  }
}

async function applyFix(action) {
  if (action === 'flush-dns') {
    await flushDns();
    addLog('✅ 已执行 DNS 缓存刷新，3 秒后重新诊断...', 'ok');
    setTimeout(runDiagnose, 3000);
  } else if (action.startsWith('switch-dns:')) {
    const servers = action.replace('switch-dns:', '').split(',').map(s=>s.trim());
    addLog('⚡ 正在切换 DNS...');
    try {
      const r = await api('/api/optimize/dns', {servers});
      if (r.ok) {
        addLog(`✅ DNS 已切换: ${servers.join(', ')}`, 'ok');
        setTimeout(runDiagnose, 2000);
      } else {
        addLog(`❌ ${r.error}`, 'err');
      }
    } catch(e) {
      addLog(`❌ ${e.message}`, 'err');
    }
  }
}

function addLog(msg, cls) {
  const log = document.getElementById('logArea');
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0')+':'+
               now.getMinutes().toString().padStart(2,'0')+':'+
               now.getSeconds().toString().padStart(2,'0');
  const clsName = cls==='ok'?'log-ok':cls==='err'?'log-err':'';
  log.innerHTML += `<div class="log-entry"><span class="log-time">${time}</span><span class="${clsName}">${msg}</span></div>`;
  log.scrollTop = log.scrollHeight;
}
</script>
