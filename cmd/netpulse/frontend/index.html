<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NetPulse — 网络环境检测 & 优化工具">
<meta name="color-scheme" content="dark">
<title>NetPulse</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/global.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>

<div class="container">

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-left">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8l2.8-2.8M17 7l2.8-2.8"/></svg>
      </div>
      <div class="brand">
        <h1 class="title">NetPulse</h1>
        <div class="status-row">
          <span class="status-dot" id="globalDot"></span>
          <span class="status-text" id="globalStatus">检测中…</span>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="refreshAll()">⟳ 刷新</button>
    </div>
  </header>

  <!-- ===== Metric Cards (asymmetric: hero + 2 compact) ===== -->
  <div class="metrics-grid" id="cards">
    <!-- Latency — hero card -->
    <article class="metric hero">
      <div class="metric-label">延迟 · Latency</div>
      <div class="metric-value" id="latVal">--</div>
      <div class="metric-sub" id="latSub">丢包率 --</div>
    </article>

    <!-- DNS -->
    <article class="metric">
      <div class="metric-label">DNS 解析</div>
      <div class="metric-value" id="dnsVal">--</div>
      <div class="metric-sub" id="dnsSub">--</div>
    </article>

    <!-- WiFi -->
    <article class="metric">
      <div class="metric-label">WiFi 信号</div>
      <div class="metric-value" id="wifiVal">--</div>
      <div class="metric-sub" id="wifiSub">--</div>
      <div class="signal-bars">
        <span class="bar"></span><span class="bar"></span>
        <span class="bar"></span><span class="bar"></span>
      </div>
    </article>
  </div>

  <!-- ===== Panels: Detect + Optimize ===== -->
  <div class="panels-grid">

    <!-- Detection Panel -->
    <section class="panel" aria-labelledby="detect-title">
      <div class="panel-header">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <h2 class="panel-title" id="detect-title">深度检测</h2>
        <span class="panel-indicator"></span>
      </div>
      <div class="quick-actions">
        <button class="btn btn-sm" onclick="runPing('www.baidu.com',5)">Ping 百度</button>
        <button class="btn btn-sm" onclick="runPing('www.google.com',5)">Ping Google</button>
        <button class="btn btn-sm" onclick="runDnsSpeed()">DNS 测速</button>
        <button class="btn btn-sm" onclick="runTrace('www.baidu.com')">路由追踪</button>
        <button class="btn btn-sm primary" onclick="runDiagnose()">一键诊断</button>
      </div>
      <div class="output-area" id="detectOutput">点击上方按钮开始检测…</div>
      <div id="diagnoseResults" style="display:none;margin-top:var(--s-3)"></div>
    </section>

    <!-- Optimization Panel -->
    <section class="panel" aria-labelledby="opt-title">
      <div class="panel-header">
        <svg viewBox="0 0 24 24"><path d="M13 12h7M13 8h4M13 16h5M6 7v10M2 12h8"/></svg>
        <h2 class="panel-title" id="opt-title">一键优化</h2>
        <span class="panel-indicator"></span>
      </div>
      <div class="dns-grid" id="dnsGrid"></div>
      <div class="dns-custom">
        <input type="text" id="customDns" placeholder="自定义 DNS，如 8.8.8.8, 8.8.4.4" aria-label="自定义 DNS">
        <button class="btn btn-sm primary" onclick="setCustomDns()">应用</button>
      </div>
      <div class="opt-actions">
        <button class="btn btn-sm danger" onclick="flushDns()">刷新 DNS 缓存</button>
        <button class="btn btn-sm" id="proxyBtn" onclick="toggleProxyBtn()">代理状态</button>
      </div>
      <div class="log-area" id="logArea" role="log" aria-label="操作日志">
        <div class="log-entry"><span class="log-time">--:--</span><span>等待操作…</span></div>
      </div>
    </section>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/state.js"></script>
<script src="/js/detect.js"></script>
<script src="/js/diagnose.js"></script>
<script src="/js/optimize.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
